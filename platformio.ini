 ; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32F407VET6]
platform = ststm32@19.7.0
board = genericSTM32F407VET6
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries

build_flags =
    -D SERIAL_RX_BUFFER_SIZE=256
    -D SERIAL_TX_BUFFER_SIZE=256
    -D HAL_IWDG_MODULE_ENABLED

; upload_protocol = stlink
upload_protocol = custom
upload_command = "C:/Program Files/STMicroelectronics/STM32Cube/STM32CubeProgrammer/bin/STM32_Programmer_CLI.exe" -c port=USB1 -d $SOURCE 0x08000000

monitor_speed = 9600
